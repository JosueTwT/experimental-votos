<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 Ranking de Canciones</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div id="toast-container"></div>

    <div class="main-container">
        <header>
            <h1>🔥 Ranking Musical</h1>
            <p>Vota por tus canciones favoritas para el evento</p>
            <p>Cada persona cuenta con <strong>5 votos</strong> disponibles</p>
        </header>

        <div class="glass-card list-section">
            <div class="list-header">
                <h2>Top Canciones</h2>
                <button class="btn-icon" onclick="cargarCanciones()" title="Actualizar">🔄</button>
            </div>
            <div id="lista-canciones" class="scroll-area">
                <div class="loading-spinner"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
